name: PR checks

# Gates that run on every pull request (including from forks) AND on every
# push to main.  The disc-derived target is not redistributable, so this
# workflow never links the game.  The `checks` job needs nothing but
# Python + git:
#
#   1. the pytest suite (build-helper / carver invariants),
#   2. a game-data leak guard (no ISO/AFS/boot-ELF/SDK/binary blobs), and
#   3. a progress-report consistency lint.
#
# The `link-symbols` job fetches the public compilers the way a fresh clone
# does and compiles every TU without its asm, to prove that each symbol the
# link needs comes from a committed file.
#
# Running on push (not just pull_request) is deliberate: these gates used to be
# invisible while matching directly on main — a red suite only surfaced when a
# fork opened a PR.  The push trigger surfaces any drift (stale generated
# artifacts, band-model regressions) on the commit that introduces it.
#
# The byte-level match itself is verified locally by the contributor with
# objdiff (see CONTRIBUTING.md); it cannot run here.
#
# Exit-code policy for every gate below.  A gate that examined nothing must
# never look like a gate that passed:
#
#   0    the gate ran and its predicate holds (an empty input set is a pass
#        only when the set was genuinely determined and genuinely empty).
#   1    the gate ran and found a violation.
#   2    the gate ran but could not determine its input — the verdict is VOID.
#   77   a prerequisite is absent.
#
# NO code is translated to green here.  A previous version wrapped each call in
# `[ "$rc" = 77 ] && exit 0`, which laundered a skip into a pass at the YAML
# layer.  Every prerequisite these three gates need is a TRACKED file, so a 77
# in this workflow means the checkout lost something and the gate checked
# nothing.  That must be red, not green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff guard)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

      # Resolve a base that is correct for THIS event.  On a pull_request the
      # base is the target commit.  On a push the base is the commit the branch
      # pointed at BEFORE the push; `origin/main` is not usable there, because
      # in a push-to-main checkout origin/main IS the pushed commit, which makes
      # the diff range degenerate and the guard vacuous.
      - name: Resolve the diff base
        id: diff_base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          ZERO=0000000000000000000000000000000000000000
          base=""
          if [ -n "${PR_BASE:-}" ]; then
            base="$PR_BASE"
            src="pull_request.base.sha"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
            src="push.before"
          elif git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            # workflow_dispatch, a branch-creation push, or a force-push whose
            # old tip is unreachable.  HEAD^ still yields a real, non-degenerate
            # range covering the tip commit.
            base="$(git rev-parse HEAD^)"
            src="HEAD^ fallback"
          else
            src="NONE — no usable base"
          fi
          echo "resolved diff base: ${base:-<empty>} (source: $src)"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # No exit code is translated here.  0 passes; 1 (violation), 2 (void
      # verdict — the changed set could not be determined) and 77 (not a git
      # repo) all fail the step, because after actions/checkout none of them
      # describes a healthy run.
      - name: Guard against committed game data
        env:
          DIFF_BASE: ${{ steps.diff_base.outputs.sha }}
        run: bash scripts/checks/ci_no_game_data.sh

      - name: Lint progress report consistency
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/checks/report_lint.py || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::error::report_lint.py skipped: progress/report.json is absent."
            echo "That file is tracked, so a skip here means this gate examined"
            echo "nothing.  A skipped gate is not a passing gate."
            exit 1
          fi
          exit $rc

      - name: Reconcile README + badges with report
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/checks/doc_figures.py || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::error::doc_figures.py skipped: progress/report.json is absent."
            echo "That file is tracked, so a skip here means this gate examined"
            echo "nothing.  A skipped gate is not a passing gate."
            exit 1
          fi
          exit $rc

  # The link itself needs the retail ELF.  What a commit can break on its own
  # is the naming: a TU that calls a symbol no committed file defines, or a
  # carve whose name splat will not write (issue #3).  A 77 here means the
  # install step left no toolchain, so it fails the job like any nonzero exit.
  link-symbols:
    # Pinned: its binutils (2.42) assembles the R5900 code; 2.46 rejects it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -yq binutils-mipsel-linux-gnu libc6:i386
          bash scripts/setup_toolchain.sh

      - name: Resolve every link symbol from committed files
        run: python3 scripts/checks/link_symbols.py
